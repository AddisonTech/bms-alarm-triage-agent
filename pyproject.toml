[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bms-alarm-triage-agent"
version = "0.2.2"
description = "Turns a raw building automation alarm queue into a short ranked list of what to look at first."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Addison Smith" }]

# The model is served locally by Ollama over localhost and is reached with
# urllib from the standard library, so there is no HTTP client dependency
# and no cloud SDK anywhere in the runtime path (P2-C1, P2-C2). tzdata is the
# IANA zone database, so a display time zone works on Windows, which ships
# none for Python.
dependencies = ["langgraph>=0.2", "tzdata>=2024.1"]

# The showcase can have Claude Haiku write each card's two sentences when
# the page is built (tools/haiku_writer.py), and bms_triage_service can use
# it for a journal run when TRIAGE_ANTHROPIC_KEY is set. Both sit outside
# the agent package, so the SDK is an optional extra and never part of the
# agent's runtime path.
[project.optional-dependencies]
dev = ["pytest>=8"]
showcase = ["anthropic>=1.15"]

[project.scripts]
bms-triage = "bms_alarm_triage.cli:main"
bms-triage-journal = "bms_triage_service.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

# The configuration ships inside the package so an installed copy finds it.
# A test holds it byte for byte equal to config/triage.json.
[tool.setuptools.package-data]
bms_alarm_triage = ["triage.json"]
# The write-up eval scorecard, so a program that installs the agent can show
# how its writers are graded without the repository. evals/run.py writes it.
bms_triage_service = ["eval_scorecard.json"]

# tools/ holds the alarm-log generator and the evaluation harness. Neither
# is product, so neither is packaged; keeping them out of the wheel is the
# mechanical half of the rule that the agent must not import the generator.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
