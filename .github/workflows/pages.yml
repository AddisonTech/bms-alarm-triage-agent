# Tests every change, and publishes the showcase page to GitHub Pages
# whenever main moves. The page is built from the synthetic holdout split.
# Its written explanations replay the Claude Haiku replies saved in
# showcase/haiku_record_holdout.json by the last local build with the API;
# no key is needed or used here, every reply is checked again by the same
# guardrails, and any card that fails or has no saved reply gets the
# template. Nothing is published if a test fails.
name: Test and publish showcase

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q

      - name: Build the showcase
        run: >
          python -m tools.showcase --split holdout --model haiku-replay --fonts
          --repo-url "${{ github.server_url }}/${{ github.repository }}"
          --out site/index.html

      - name: Upload the page
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
